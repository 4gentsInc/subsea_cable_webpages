<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="1000" height="860" role="img" aria-labelledby="title desc">
<title id="title">The Cable sinks as Goal occurrences are deduced</title>
<desc id="desc">A Goal tree three levels deep under one Root occurrence, with Anchors on the seafloor. Six numbered Cable lines follow one input through successive stages: only that input's Root occurrence exposed; A and B exposed; A1, A2 and B exposed; the first Anchor touched down; three Anchors touched down while B1 remains; and, after decommission and drainage, every leaf the segment reached listed in authored order as the Fully Touchdown Cable.</desc>
