<text x="412.5" y="534" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2b3a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Fully Touchdown Cable = [ $a, $b, $c, $d, $e ]<tspan font-weight="400" fill="#566676" font-size="12.5"> (schematic)</tspan></text>
<circle cx="30.0" cy="581.0" r="12" fill="#f0a3ab" stroke="#ffffff" stroke-width="2"/><text x="30.0" y="586.0" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">1</text>
<text x="52" y="586" font-size="15" font-weight="700" fill="#1d2b3a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Laid, one input admitted</text>
<text x="52" y="605" font-size="13.5" fill="#566676" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">That input's Root occurrence is exposed; everything beyond</text>
<text x="52" y="622" font-size="13.5" fill="#566676" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">it stays folded.</text>
<circle cx="30.0" cy="653.0" r="12" fill="#e6808d" stroke="#ffffff" stroke-width="2"/><text x="30.0" y="658.0" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">2</text>
<text x="52" y="658" font-size="15" font-weight="700" fill="#1d2b3a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Root deduced</text>
<text x="52" y="677" font-size="13.5" fill="#566676" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">A and B are exposed; which definition each selects</text>
<text x="52" y="694" font-size="13.5" fill="#566676" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">can still change.</text>
<circle cx="30.0" cy="725.0" r="12" fill="#d95f71" stroke="#ffffff" stroke-width="2"/><text x="30.0" y="730.0" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">3</text>
<text x="52" y="730" font-size="15" font-weight="700" fill="#1d2b3a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">A deduced</text>
<text x="52" y="749" font-size="13.5" fill="#566676" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">A1 and A2 are exposed; each Goal occurrence is deduced</text>
<text x="52" y="766" font-size="13.5" fill="#566676" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">only when it is demanded.</text>
<circle cx="520.0" cy="581.0" r="12" fill="#c33f57" stroke="#ffffff" stroke-width="2"/><text x="520.0" y="586.0" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">4</text>
<text x="542" y="586" font-size="15" font-weight="700" fill="#1d2b3a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">First Touchdown</text>
<text x="542" y="605" font-size="13.5" fill="#566676" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">$a is available to the Scheduler, not yet run;</text>
<text x="542" y="622" font-size="13.5" fill="#566676" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">A2 and B are still undeduced.</text>
<circle cx="520.0" cy="653.0" r="12" fill="#a12745" stroke="#ffffff" stroke-width="2"/><text x="520.0" y="658.0" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">5</text>
<text x="542" y="658" font-size="15" font-weight="700" fill="#1d2b3a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">A2 and B deduced</text>
<text x="542" y="677" font-size="13.5" fill="#566676" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">$b and $c touch down; B1 is exposed but undeduced.</text>
<circle cx="520.0" cy="725.0" r="12" fill="#741434" stroke="#ffffff" stroke-width="2"/><text x="520.0" y="730.0" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">6</text>
<text x="542" y="730" font-size="15" font-weight="700" fill="#1d2b3a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Fully Touchdown Cable</text>
<text x="542" y="749" font-size="13.5" fill="#566676" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">After decommission and drainage, every leaf the segment</text>
<text x="542" y="766" font-size="13.5" fill="#566676" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">reached is listed in authored order.</text>
