<line x1="0" y1="470" x2="1000" y2="470" stroke="#b99c5f" stroke-width="2"/>
<text x="24" y="30" font-size="20" font-weight="700" fill="#1d2b3a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">How a Cable reaches Touchdown</text>
<text x="24" y="52" font-size="13.5" fill="#566676" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Each numbered line is the Cable for one input at one moment.</text>
<text x="24" y="70" font-size="13.5" fill="#566676" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Each deduction commits one demanded occurrence and exposes its children.</text>
<text x="982" y="106" text-anchor="end" font-size="12" fill="#566676" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Sea · Goal space</text>
<text x="982" y="492" text-anchor="end" font-size="12" fill="#7a6438" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Seafloor · Host</text>
