name: Validate website and public intake

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: site/requirements.txt
      - name: Install check dependencies
        run: python -m pip install --requirement site/requirements.txt
      - name: Test publication selection and intake
        run: |
          python .github/scripts/test_site_publication.py
          python .github/scripts/labels.py validate
          python .github/scripts/test_intake_scripts.py
      - name: Verify committed static output without document sources
        run: python .github/scripts/check_site_publication.py --site-dir build --output-only
